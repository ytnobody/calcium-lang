name: Release

on:
  push:
    tags:
      - "v*"
  # `workflow_dispatch` is an explicit exception to the GITHUB_TOKEN rule
  # (tags pushed by auto-release.yml don't trigger this workflow on their
  # own), so auto-release.yml dispatches us here. It also lets maintainers
  # (re)publish an existing tag, e.g. to backfill missing releases.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.21). Required for manual dispatch; leave unset on tag pushes."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}