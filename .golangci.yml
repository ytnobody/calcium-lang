version: "2"
run:
  go: "1.26"
linters:
  disable:
    - unused
  settings:
    errcheck:
      exclude-functions:
        - os.Chdir
        - os.WriteFile
        - os.Remove
        - os.RemoveAll
        - (io.Closer).Close
        - (*github.com/ytnobody/calcium-lang/pkg/vm.VM).push
        - github.com/ytnobody/calcium-lang/pkg/vm.saveToCacheDir
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - staticcheck
        text: "ST1005:"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
